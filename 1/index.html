  connectedCallback() {
    this.shadow.querySelectorAll(".tg-link").forEach((a) => {
      a.href = window.CricConfig.telegramLink;
    });
    // lock check removed – always unlocked
    this.initEventListeners();
    this.setupMessageListener();
    this.fetchChannels();
    window.addEventListener("popstate", () => this.handleUrlRouting());
  }

  disconnectedCallback() {
    if (this.lockTimer) clearTimeout(this.lockTimer);
  }

  /* Unlock status – always true */
  checkUnlockStatus() {
    this.isUnlocked = true;
  }

  /* Fetch channels */
  async fetchChannels() {
    const grid = this.shadow.querySelector("#channels-grid");
    const rows = this.shadow.querySelector("#sportsRows");
    try {
      const res = await fetch(window.CricConfig.sourceUrl);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      this.masterChannels = Array.isArray(data)
        ? data
        : (data.iframes || data.channels || data.streams || data.data || []);

      if (this.masterChannels.length === 0) {
        grid.innerHTML = '<div class="state-container">No channels found.</div>';
        rows.innerHTML = '<div class="state-container">No channels found.</div>';
        return;
      }
      this.renderGrid();
      this.renderSportsView();
      this.handleUrlRouting();
    } catch (err) {
      console.error("Channel feed error:", err);
      const failed = '<div class="state-container" style="color:#ef4444;">Failed to load channels feed.</div>';
      grid.innerHTML = failed;
      rows.innerHTML = failed;
      if (this.initialPendingId) this.closePlayer();
    }
  }

  getCategory(channel, title) {
    const lower = title.toLowerCase();
    if (lower.includes("star")) return "STAR";
    if (lower.includes("sony")) return "SONY";
    return String(channel.category || title.split(" ")[0] || "LIVE").toUpperCase();
  }

  getItems() {
    return this.masterChannels.map((channel, index) => {
      const title = String(channel.title || channel.name || channel.channel || channel.id || `Channel ${index + 1}`);
      return {
        id: channel.id !== undefined ? channel.id : index,
        title,
        poster: channel.poster || channel.image || channel.logo || channel.img || "",
        category: this.getCategory(channel, title)
      };
    });
  }

  buildCard(item) {
    const C = window.CricConfig;
    const logoMap = {
      STAR: C.starLogo, SONY: C.sonyLogo, FOX: C.foxLogo,
      SKY: C.skyLogo, WILLOW: C.willowLogo, TNT: C.tntLogo
    };
    const playIcon = '<div class="play-overlay"><div><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>';
    const logo = logoMap[item.category];
    let thumbStyle = "";
    let inner = "";

    if (logo) {
      inner = `<div class="logo-box"><img src="${logo}" alt="${this.escapeHtml(item.category)}" loading="lazy" referrerpolicy="no-referrer"></div>
               <span class="net-tag">${this.escapeHtml(item.category)}</span>`;
    } else if (item.poster) {
      thumbStyle = ` style="background-image:url('${String(item.poster).replace(/'/g, "%27")}')"`;
    } else {
      inner = `<div class="badge-box"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z M2 17l10 5 10-5 M2 12l10 5 10-5"/></svg></div>
               <span class="net-tag">${this.escapeHtml(item.category)}</span>`;
    }

    const card = document.createElement("div");
    card.className = "channel-card";
    card.onclick = () => this.openPlayer(item.id);
    card.innerHTML = `
      <div class="thumb"${thumbStyle}>
        ${inner}
        <span class="badge-live"><i class="live-dot"></i> Live</span>
        <span class="badge-cat">${this.escapeHtml(item.category)}</span>
        ${playIcon}
      </div>
      <div class="card-body">
        <div class="card-title">${this.escapeHtml(item.title)}</div>
        <div class="card-meta">HD feed &middot; <span style="color:var(--accent)">Watch now</span></div>
      </div>`;
    return card;
  }

  renderGrid() {
    const grid = this.shadow.querySelector("#channels-grid");
    const chips = this.shadow.querySelector("#filterChips");
    const items = this.getItems();
    if (!items.length) return;

    this.shadow.querySelector("#heroCount").textContent = `⚡ ${items.length} HD streams live`;
    this.shadow.querySelector("#liveCount").textContent = `${items.length} live · instant-start playback`;

    const counts = {};
    items.forEach((i) => { counts[i.category] = (counts[i.category] || 0) + 1; });
    if (this.activeFilter !== "ALL" && !counts[this.activeFilter]) {
      this.activeFilter = "ALL";
    }
    const chipList = [["ALL", "All channels"]].concat(Object.keys(counts).map((k) => [k, k]));
    chips.innerHTML = chipList.map(([key, label]) => `
      <button class="chip ${key === this.activeFilter ? "active" : ""}" data-filter="${this.escapeHtml(key)}">
        ${this.escapeHtml(label)}
      </button>`).join("");
    chips.querySelectorAll(".chip").forEach((btn) => {
      btn.onclick = () => {
        this.activeFilter = btn.dataset.filter;
        this.renderGrid();
      };
    });

    grid.innerHTML = "";
    items
      .filter((i) => this.activeFilter === "ALL" || i.category === this.activeFilter)
      .forEach((item) => grid.appendChild(this.buildCard(item)));
  }

  renderSportsView() {
    const wrap = this.shadow.querySelector("#sportsRows");
    const countEl = this.shadow.querySelector("#sportsCount");
    const query = this.sportsQuery.trim().toLowerCase();

    const items = this.getItems().filter((i) =>
      !query || i.title.toLowerCase().includes(query) || i.category.toLowerCase().includes(query)
    );

    if (!items.length) {
      countEl.textContent = "No matches";
      wrap.innerHTML = '<div class="state-container">No channels match your search.</div>';
      return;
    }

    const groups = {};
    items.forEach((i) => {
      (groups[i.category] = groups[i.category] || []).push(i);
    });

    const order = window.CricConfig.sportsOrder || [];
    const names = Object.keys(groups).sort((a, b) => {
      const ia = order.indexOf(a) < 0 ? 999 : order.indexOf(a);
      const ib = order.indexOf(b) < 0 ? 999 : order.indexOf(b);
      return ia - ib || a.localeCompare(b);
    });

    countEl.textContent = `${names.length} networks · ${items.length} channels`;
    wrap.innerHTML = "";

    names.forEach((name) => {
      const list = groups[name];
      const section = document.createElement("section");
      section.className = "net-section";
      section.innerHTML = `
        <div class="net-head">
          <h2>${this.escapeHtml(name)}<small>${list.length} ${list.length === 1 ? "channel" : "channels"}</small></h2>
          <button class="chip" data-viewall>View all</button>
        </div>
        <div class="h-row"></div>`;

      section.querySelector("[data-viewall]").onclick = () => {
        this.activeFilter = name;
        this.switchTab("live");
        this.renderGrid();
      };

      const row = section.querySelector(".h-row");
      list.forEach((item) => row.appendChild(this.buildCard(item)));
      wrap.appendChild(section);
    });
  }

  escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  showView(name) {
    const views = { home: "#home-view", sports: "#sports-view", player: "#player-view" };
    Object.keys(views).forEach((key) => {
      this.shadow.querySelector(views[key]).classList.toggle("active", key === name);
    });
  }

  updateNav() {
    this.shadow.querySelectorAll(".nav-live").forEach((el) => el.classList.toggle("active", this.activeTab === "live"));
    this.shadow.querySelectorAll(".nav-sports").forEach((el) => el.classList.toggle("active", this.activeTab === "sports"));
  }

  switchTab(tab) {
    this.activeTab = tab;
    this.updateNav();
    if (this.currentStreamId !== null) {
      this.closePlayer();
    } else {
      this.showView(tab === "sports" ? "sports" : "home");
    }
    window.scrollTo(0, 0);
  }

  getStreamType(ch) {
    const url = String(ch.url || ch.stream_url || ch.mpd || ch.m3u8 || "");
    if (ch.type === "hls" || ch.type === "dash" || ch.type === "page") return ch.type;
    if (ch.key_id && ch.key) return "dash";
    if (/\.m3u8(\?|#|$)/i.test(url)) return "hls";
    if (/\.mpd(\?|#|$)/i.test(url)) return "dash";
    return "page";
  }

  buildPlayerDoc(ch) {
    const cfg = {
      url: String(ch.url || ch.stream_url || ch.mpd || ch.m3u8 || ""),
      type: this.getStreamType(ch) === "hls" ? "hls" : "dash",
      cookie: ch.cookie ? String(ch.cookie) : "",
      exp: Number(ch.cookie_expire) || 0,
      keyId: ch.key_id ? String(ch.key_id).trim() : "",
      key: ch.key ? String(ch.key).trim() : ""
    };
    const cfgJson = JSON.stringify(cfg).replace(/</g, "\\u003c");

    const boot = function (cfg) {
      var v = document.getElementById("v");
      var msg = document.getElementById("msg");
      function say(t) {
        msg.textContent = t;
        msg.style.display = t ? "block" : "none";
      }
      function ok() {
        try { parent.postMessage("coverxedge-playing", "*"); } catch (e) {}
      }
      v.addEventListener("playing", ok);
      window.addEventListener("message", function (e) {
        if (e.data === "coverxedge-force-pause") v.pause();
        if (e.data === "coverxedge-force-play") v.play().catch(function () {});
      });

      var expired = cfg.exp && Date.now() / 1000 > cfg.exp;
      if (!cfg.url) { say("Stream URL missing"); return; }

      if (cfg.type === "hls") {
        if (window.Hls && Hls.isSupported()) {
          var h = new Hls({ lowLatencyMode: true });
          h.loadSource(cfg.url);
          h.attachMedia(v);
          h.on(Hls.Events.MANIFEST_PARSED, function () { v.play().catch(function () {}); });
          h.on(Hls.Events.ERROR, function (_, d) {
            if (!d.fatal) return;
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR) h.startLoad();
            else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
            else { h.destroy(); say("Playback error"); }
          });
        } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
          v.src = cfg.url;
          v.play().catch(function () {});
        } else {
          say("Browser not supported");
        }
        return;
      }

      if (!window.shaka) { say("Player failed to load"); return; }
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) { say("Browser not supported"); return; }

      var auth = [];
      if (cfg.cookie) {
        cfg.cookie.split(";").forEach(function (p) {
          p = p.trim();
          if (p.indexOf("=") > 0) auth.push(p);
        });
      }

      function onErr(e) {
        var d = (e && e.detail) || e || {};
        console.error("Shaka error", d);
        say("Playback error" + (d.code ? " (" + d.code + ")" : "") + (expired ? " - cookie expired" : ""));
      }

      var player = new shaka.Player();
      player.attach(v).then(function () {
        var net = player.getNetworkingEngine();
        if (auth.length) {
          net.registerRequestFilter(function (type, req) {
            if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) return;
            req.uris = req.uris.map(function (u) {
              var out = u;
              auth.forEach(function (pair) {
                var name = pair.split("=")[0];
                if (out.indexOf(name + "=") === -1) {
                  out += (out.indexOf("?") === -1 ? "?" : "&") + pair;
                }
              });
              return out;
            });
          });
        }
        var conf = { streaming: { lowLatencyMode: true } };
        if (cfg.keyId && cfg.key) {
          var ck = {};
          ck[cfg.keyId] = cfg.key;
          conf.drm = { clearKeys: ck };
        }
        player.configure(conf);
        player.addEventListener("error", onErr);
        return player.load(cfg.url);
      }).then(function () {
        v.play().catch(function () {});
      }).catch(onErr);
    };

    return '<!DOCTYPE html><html><head><meta charset="UTF-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}'
      + 'video{width:100%;height:100%;background:#000;outline:none}'
      + '#msg{display:none;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#ff6b6b;font:600 14px sans-serif;padding:0 16px;pointer-events:none}</style>'
      + '<script src="' + (cfg.type === "hls"
        ? "https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"
        : "https://cdn.jsdelivr.net/npm/shaka-player@4.7.11/dist/shaka-player.compiled.js") + '"><\\/script></head><body>'
      + '<video id="v" controls autoplay playsinline></video><div id="msg"></div>'
      + '<script>(' + boot.toString() + ')(' + cfgJson + ');<\\/script></body></html>';
  }

  openPlayer(identifier) {
    const target = this.masterChannels.find(
      (ch, idx) => String(ch.id).toLowerCase() === String(identifier).toLowerCase() || idx == identifier
    );
    if (!target) {
      this.closePlayer();
      return;
    }
    const streamUrl = target.url || target.stream_url || target.mpd || target.m3u8;
    if (!streamUrl) {
      this.closePlayer();
      return;
    }

    const title = target.title || target.name || target.channel || target.id || "Live Broadcast";
    this.currentStreamId = identifier;
    this.shadow.querySelector("#activeStreamTitleDisplay").innerText = title;

    const frame = this.shadow.querySelector("#player");
    if (this.getStreamType(target) === "page") {
      this.currentEmbedUrl = streamUrl;
      frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-presentation");
      frame.removeAttribute("srcdoc");
      frame.src = streamUrl;
    } else {
      this.currentEmbedUrl = null;
      frame.removeAttribute("sandbox");
      frame.srcdoc = this.buildPlayerDoc(target);
    }

    const loadingOverlay = this.shadow.querySelector("#streamLoadingOverlay");
    if (loadingOverlay) loadingOverlay.classList.add("hidden");
    this.showView("player");

    // No lock timer – permanently unlocked
    const query = `?${this.paramName}=${encodeURIComponent(identifier)}`;
    if (window.location.search !== query) {
      history.pushState({ playerOpen: true, id: identifier }, "", query);
    }
    window.scrollTo(0, 0);
  }

  closePlayer() {
    const playerFrame = this.shadow.querySelector("#player");
    playerFrame.removeAttribute("srcdoc");
    playerFrame.src = "about:blank";
    this.currentEmbedUrl = null;

    const loadingOverlayEl = this.shadow.querySelector("#streamLoadingOverlay");
    if (loadingOverlayEl) loadingOverlayEl.classList.add("hidden");
    if (this.lockTimer) {
      clearTimeout(this.lockTimer);
      this.lockTimer = null;
    }
    // modal never shown

    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (err) {}

    this.shadow.querySelector("#playerContainer").classList.remove("fs-active");
    this.shadow.querySelector("#themeSwitchDeck").classList.remove("hidden");
    this.showView(this.activeTab === "sports" ? "sports" : "home");
    this.currentStreamId = null;

    if (window.location.search !== "") {
      history.pushState({}, "", window.location.pathname);
    }
  }

  getChannelParam() {
    const params = new URLSearchParams(window.location.search);
    if (params.has("ch")) {
      this.paramName = "ch";
      return params.get("ch");
    }
    if (params.has("id")) {
      this.paramName = "id";
      return params.get("id");
    }
    return null;
  }

  handleUrlRouting() {
    const id = this.getChannelParam();
    if (id !== null && this.masterChannels.length > 0) {
      this.openPlayer(id);
    } else if (id === null && this.currentStreamId !== null) {
      this.closePlayer();
    }
  }

  pausePlayer() {
    const f = this.shadow.querySelector("#player");
    if (!f) return;
    if (this.currentEmbedUrl) { f.src = "about:blank"; return; }
    try { if (f.contentWindow) f.contentWindow.postMessage("coverxedge-force-pause", "*"); } catch (e) {}
  }

  resumePlayer() {
    const f = this.shadow.querySelector("#player");
    if (!f) return;
    if (this.currentEmbedUrl) { f.src = this.currentEmbedUrl; return; }
    try { if (f.contentWindow) f.contentWindow.postMessage("coverxedge-force-play", "*"); } catch (e) {}
  }

  /* Lock functions neutered */
  triggerLock() { /* no-op */ }
  handleJoinTelegram() {
    window.open(window.CricConfig.telegramLink, "_blank", "noopener");
  }
  handleLater() { /* no-op */ }

  toggleFullscreen() {
    const rig = this.shadow.querySelector("#playerContainer");
    const themeDeck = this.shadow.querySelector("#themeSwitchDeck");
    if (!rig) return;

    const isFull = document.fullscreenElement || rig.classList.contains("fs-active");
    if (!isFull) {
      rig.classList.add("fs-active");
      if (themeDeck) themeDeck.classList.add("hidden");
      try {
        if (rig.requestFullscreen) rig.requestFullscreen().catch(() => {});
      } catch (err) {}
    } else {
      rig.classList.remove("fs-active");
      if (themeDeck) themeDeck.classList.remove("hidden");
      try {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      } catch (err) {}
    }
  }

  setupMessageListener() {
    window.addEventListener("message", (e) => {
      // no lock on playing message
    });

    document.addEventListener("fullscreenchange", () => {
      const rig = this.shadow.querySelector("#playerContainer");
      const themeDeck = this.shadow.querySelector("#themeSwitchDeck");
      if (!document.fullscreenElement && !document.webkitIsFullScreen && rig) {
        rig.classList.remove("fs-active");
        if (themeDeck) themeDeck.classList.remove("hidden");
      }
    });
  }

  initEventListeners() {
    const goLive = () => this.switchTab("live");
    this.shadow.querySelector("#brandHomeLink").onclick = goLive;
    this.shadow.querySelector("#brandHomeLinkMobile").onclick = goLive;

    this.shadow.querySelectorAll(".nav-live").forEach((el) => {
      el.onclick = () => this.switchTab("live");
    });
    this.shadow.querySelectorAll(".nav-sports").forEach((el) => {
      el.onclick = () => this.switchTab("sports");
    });

    this.shadow.querySelector("#heroWatchBtn").onclick = () => {
      this.shadow.querySelector("#channelsSection").scrollIntoView({ behavior: "smooth", block: "start" });
    };
    this.shadow.querySelector("#refreshBtn").onclick = () => {
      const spinner = '<div class="state-container"><div class="spinner"></div><p>Fetching professional sports feed...</p></div>';
      this.shadow.querySelector("#channels-grid").innerHTML = spinner;
      this.shadow.querySelector("#sportsRows").innerHTML = spinner;
      this.fetchChannels();
    };

    this.shadow.querySelector("#sportsSearch").addEventListener("input", (e) => {
      this.sportsQuery = e.target.value;
      if (this.masterChannels.length) this.renderSportsView();
    });

    // Telegram buttons still open the link, but do not unlock anything (already unlocked)
    this.shadow.querySelectorAll(".tg-link").forEach((a) => {
      a.onclick = (e) => {
        // let the link work normally
      };
    });

    this.shadow.querySelector("#themeDarkBtn").onclick = () => {
      this.removeAttribute("data-theme");
      this.shadow.querySelector("#themeDarkBtn").classList.add("active");
      this.shadow.querySelector("#themeLightBtn").classList.remove("active");
    };
    this.shadow.querySelector("#themeLightBtn").onclick = () => {
      this.setAttribute("data-theme", "light");
      this.shadow.querySelector("#themeLightBtn").classList.add("active");
      this.shadow.querySelector("#themeDarkBtn").classList.remove("active");
    };

    const btnShare = this.shadow.querySelector("#btnShare");
    const shareText = this.shadow.querySelector("#shareBtnText");

    const fallbackCopy = (text) => {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.top = "0";
      temp.style.left = "0";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange(0, text.length);
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(temp);
      return ok;
    };

    const flashShareText = (msg) => {
      shareText.textContent = msg;
      setTimeout(() => { shareText.textContent = "SHARE STREAM"; }, 1800);
    };

    btnShare.onclick = async () => {
      const shareUrl = window.location.href;
      if (navigator.share) {
        try {
          await navigator.share({ title: "COVERXEDGE Live", url: shareUrl });
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(shareUrl);
          flashShareText("COPIED!");
          return;
        }
      } catch (err) {}
      if (fallbackCopy(shareUrl)) {
        flashShareText("COPIED!");
      } else {
        window.prompt("Copy this link:", shareUrl);
      }
    };
  }
}

customElements.define("cricxprime-ui", CricXPrimeUI);
</script>

<cricxprime-ui></cricxprime-ui>
